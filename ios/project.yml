name: CrispyRewriteApple
options:
  bundleIdPrefix: com.crispy.rewrite
packages:
  ContractRunner:
    path: ../ContractRunner
targets:
  CrispyRewriteiOS:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Apps/iOS
    dependencies:
      - package: ContractRunner
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.crispy.rewrite.ios
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Apps/iOS/Info.plist
        SWIFT_VERSION: 5.9
        CODE_SIGNING_ALLOWED: NO
        CRISPY_BACKEND_URL: ""
        SUPABASE_URL: ""
        SUPABASE_PUBLISHABLE_KEY: ""
  CrispyRewritetvOS:
    type: application
    platform: tvOS
    deploymentTarget: "16.0"
    sources:
      - path: Apps/tvOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.crispy.rewrite.tvos
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: 5.9
        CODE_SIGNING_ALLOWED: NO
schemes:
  CrispyRewriteiOS:
    build:
      targets:
        CrispyRewriteiOS: all
  CrispyRewritetvOS:
    build:
      targets:
        CrispyRewritetvOS: all
