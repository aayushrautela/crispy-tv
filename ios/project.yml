name: CrispyRewriteApple
options:
  bundleIdPrefix: com.crispy.rewrite
packages:
  ContractRunner:
    path: ContractRunner
  CrispyKit:
    path: CrispyKit
  # libmpv for Apple platforms. The LGPL product, never the GPL one: the
  # iOS player links `MPVKit`, which is the variant built without GPL.
  MPVKit:
    url: https://github.com/mpvkit/MPVKit
    exactVersion: 1.1.0-n9.0.2
targets:
  CrispyRewriteiOS:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Apps/iOS
    dependencies:
      - package: ContractRunner
      - package: CrispyKit
      - package: MPVKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.crispy.rewrite.ios
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Apps/iOS/Info.plist
        SWIFT_VERSION: 5.9
        CODE_SIGNING_ALLOWED: NO
        CRISPY_BACKEND_URL: ""
        SUPABASE_URL: ""
        SUPABASE_PUBLISHABLE_KEY: ""
  CrispyRewritetvOS:
    type: application
    platform: tvOS
    deploymentTarget: "17.0"
    sources:
      - path: Apps/tvOS
    dependencies:
      - package: CrispyKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.crispy.rewrite.tvos
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: 5.9
        CODE_SIGNING_ALLOWED: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
schemes:
  CrispyRewriteiOS:
    build:
      targets:
        CrispyRewriteiOS: all
  CrispyRewritetvOS:
    build:
      targets:
        CrispyRewritetvOS: all
