org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# The single source of truth for the app version.
#
# Read by :androidApp for `defaultConfig.versionName` and by
# :android:platform-core for the generated `AppConfig.VERSION_NAME`, so the
# version the APK reports and the version the app sends to the backend cannot
# drift. This was two hardcoded literals in two build files with a comment
# claiming a check existed; there was no such check anywhere in the repository.
crispyVersionName=0.1.0
