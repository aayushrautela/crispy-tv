[versions]
# --- Build tooling ---
agp = "9.3.0"
kotlin = "2.4.10"

# --- AndroidX core ---
coreKtx = "1.19.0"
coreSplashscreen = "1.0.1"
appcompat = "1.8.0"
activityCompose = "1.13.0"

# --- Compose ---
composeBom = "2026.08.00"
material = "1.12.0"

# Material3 Expressive, on every target, via one coordinate.
#
# ## Why not `compose.material3`, and why not `androidx.compose.material3`
#
# The `compose.material3` Gradle-accessor alias deliberately tracks the latest
# *stable* Material3, which is 1.4.0 -- and 1.4.0 has no Expressive. CMP decoupled
# Material3 versioning from the plugin in 1.9.0 precisely so a project can opt
# forward; the documented way is to replace the alias with an explicit coordinate.
# See the CMP 1.9.3 whats-new, "Material 3 Expressive theme".
#
# `org.jetbrains.compose.material3:material3` is the coordinate that works
# everywhere, because it is a thin alias that delegates per target:
#
#   android -> androidx.compose.material3:material3-android:1.5.0-alpha27  (real AndroidX)
#   desktop -> org.jetbrains.compose.material3:material3-desktop:1.13.0-alpha01 (real fork)
#   ios*    -> org.jetbrains.compose.material3:material3-iosarm64:1.13.0-alpha01
#
# So there is never more than one material3 on the classpath, the
# `androidx.compose.material3` package and imports are identical on every target,
# and desktop/iOS get the Expressive widgets (`LoadingIndicator`, `MaterialShapes`,
# `WavyProgressIndicator`) that Android already had. Verified by resolving the
# dependency graph, not inferred.
#
# ## Why 1.13.0-alpha01 and not the nearer 1.12.0-alpha03
#
# Because the choice is between moving forward and moving *backward*:
#
# | version  | AndroidX material3 | AndroidX Compose | direction        |
# |----------|--------------------|------------------|------------------|
# | 1.9.0    | 1.4.0 (stable)     | 1.7.x            | no Expressive    |
# | 1.12.0-3 | 1.5.0-alpha22      | 1.12.0-beta01     | BACKWARD         |
# | 1.13.0-1 | 1.5.0-alpha27      | 1.13.0-alpha02    | forward          |
#
# `1.12.0-beta01` is *older* than the `1.12.0` stable this repo was on -- publication
# order is alpha01..alpha03, beta01, beta02, rc01, 1.12.0 -- so that option
# downgrades both material3 and the whole Compose stack. The app's goldens were
# recorded against `1.5.0-alpha26`, and 1.13.0-alpha01 is the only published
# JetBrains material3 at or ahead of it.
#
# The cost is that the Compose stack leaves stable for `1.13.0-alpha02`. That is
# accepted deliberately, and the golden screenshots are the check on it.
composeMaterial3 = "1.13.0-alpha01"

# The androidx.compose.* version. Set to what `composeMaterial3` requires on
# Android (1.13.0-alpha02) rather than left lower, so the resolved graph has one
# Compose version instead of a resolved-up surprise. A KMP source set's dependency
# handler has no `platform()`, so the BOM cannot be applied in a KMP module; the
# plain Android modules still apply `androidx-compose-bom` for everything else.
# AGENTS.md: bump this with `composeMaterial3`, never alone.
composeAndroidx = "1.13.0-alpha02"

# Compose Multiplatform. Pinned to the generation that ships with the Kotlin
# version above: Kotlin 2.4.x pairs with CMP 1.11.x. Do not bump this independently
# of `kotlin` -- a mismatch surfaces as an opaque compose-compiler error.
composeMultiplatform = "1.11.1"

# --- Lifecycle ---
# native-engine was on 2.10.0; unified to 2.11.0 (what :app already used).
lifecycle = "2.11.0"

# --- Navigation ---
# The JetBrains KMP fork, NOT `androidx.navigation:navigation-compose`. Measured
# link by link against the resolved `.module` files rather than the family:
#
#  - `org.jetbrains.androidx.navigation:navigation-compose:2.10.0-beta01` publishes
#    `androidJvm`, `desktop`, `iosArm64` and `iosSimulatorArm64`; Google's
#    `2.9.8` publishes `android` plus `jvmStubs`/`linuxx64Stubs`, which are
#    javadoc/dokka artifacts and not compilable KMP variants.
#  - The fork KEEPS the `androidx.navigation.compose` package -- 13 `.knm`
#    declaration files under `commonMain/default/linkdata/package_androidx.navigation.compose/`
#    -- so the seven navigation files need no import change at all.
#  - The stable `2.9.2` is NOT usable: it is a real KMP artifact but publishes
#    only `uikitArm64`/`uikitSimulatorArm64`/`uikitX64`, the pre-2.0 Kotlin target
#    names. The discriminator is the `org.jetbrains.kotlin.platform.type`
#    attribute, not the version and not "is it multiplatform".
#  - The fork's `navigation-runtime` carries a `-published` suffix on every
#    variant, which is Gradle's relocation marker, and its common metadata
#    depends on Google's `androidx.navigation:navigation-runtime:2.10.0` -- which
#    is itself KMP (`metadataApiElements` type=common, plus androidJvm, desktop,
#    iosArm64, iosSimulatorArm64, linuxX64). So the chain resolves to one runtime.
#  - The repository is already declared: the artifact is on Maven Central and
#    `settings.gradle.kts` already has `mavenCentral()`.
#
# This is a BETA of a FORK replacing a Google artifact in the navigation layer
# of a shipping app, and it frees no file: the navigation layer is a set of
# mutually-referencing `androidMain` files, each of which calls a `Context`-taking
# factory. See the KDoc on `AppNavHost` and the plan's navigation section.
#
# It is a SPLIT and not a swap, and the reason is measured rather than designed:
# `:android:tv` is a plain `com.android.application` that also declared the old
# alias, so renaming it would have silently repointed the shipping TV app at a
# beta fork of navigation. `:tv` has no `commonMain` and needs no KMP navigation,
# so it keeps the Google artifact below and `:app` alone moves to the fork. **The
# rename is what surfaced this** -- it broke loudly at `:tv`'s build-file compile
# instead of quietly resolving to a fork nobody had measured against the TV app.
# **A shared version catalog is a shared decision, and the blast radius of a
# rename is every module that reads the alias, not the one being edited.**
jbNavigationCompose = "2.10.0-beta01"
navigationCompose = "2.9.8"
# `androidx.navigationevent:navigationevent-compose:1.1.1` is pinned explicitly
# even though it already arrives transitively: the fork's
# `org.jetbrains.androidx.navigationevent:navigationevent-compose:1.1.0`
# re-exports Google's 1.1.1 on `metadata`+`android` but ships EMPTY
# desktop/ios/js/native variants (`available-at` redirects to hollow JB
# artifacts; the JB desktop jar is a manifest with zero classes). The explicit
# line is what puts the real KMP artifact -- and with it
# `LocalNavigationEventDispatcherOwner` -- on every target's classpath.
# 1.1.1 and not 1.1.2: it is the version the fork's own `.module` re-exports,
# so the pin changes no resolution, only its explicitness.
navigationEventCompose = "1.1.1"

# --- Paging ---
paging = "3.5.1"

# --- Media3 ---
media3 = "1.11.0"

# --- Networking ---
okhttp = "5.5.0"

# --- Image loading ---
coil = "3.5.0"

# --- Filesystem (`coil-core` brings it to `:app`; see the note by `okio-core`) ---
okio = "3.17.0"

# --- Coroutines ---
coroutines = "1.11.0"

# --- Serialization ---
serializationJson = "1.11.0"

# --- Android TV ---
tvMaterial = "1.1.0"

# --- Playback ---
libmpv = "1.0.0"
assMedia = "0.5.1"
androidyoutubeplayer = "13.0.0"

# --- Plugin runtime (sideload flavor) ---
quickjsKt = "1.0.14"
jsoup = "1.18.3"

# --- Misc ---
materialKolor = "5.0.0"
metricsPerformance = "1.0.0"
desugar = "2.1.5"
zxing = "3.5.3"
json = "20240303"

# --- Test ---
junitJupiter = "6.1.3"
junit4 = "4.13.2"
androidxTestCore = "1.6.1"
androidxTestRules = "1.6.1"
androidxTestExtJunit = "1.2.1"
