[versions]
# --- Build tooling ---
agp = "9.3.0"
kotlin = "2.4.10"

# --- AndroidX core ---
coreKtx = "1.19.0"
coreSplashscreen = "1.0.1"
appcompat = "1.8.0"
activityCompose = "1.13.0"

# --- Compose ---
composeBom = "2026.08.00"
material3 = "1.5.0-alpha26"
material = "1.12.0"

# The androidx.compose.* version the BOM above resolves to, pinned explicitly on
# the four artifacts :app needs. A KMP source set's dependency handler has no
# `platform()`, so the BOM cannot be applied in :app. Without these versions the
# Compose Multiplatform accessors supply material3 1.4.0, which lacks the
# Material3 Expressive APIs this app uses (LoadingIndicator, MaterialShapes,
# rememberBottomSheetState). They match the BOM, so :tv and :androidApp are
# unaffected -- an explicit version and a platform both resolve to 1.12.0.
composeAndroidx = "1.12.0"

# Compose Multiplatform. Pinned to the generation that ships with the Kotlin
# version above: Kotlin 2.4.x pairs with CMP 1.11.x. Do not bump this independently
# of `kotlin` -- a mismatch surfaces as an opaque compose-compiler error.
composeMultiplatform = "1.11.1"

# --- Lifecycle ---
# native-engine was on 2.10.0; unified to 2.11.0 (what :app already used).
lifecycle = "2.11.0"

# --- Navigation ---
navigationCompose = "2.9.8"

# --- Paging ---
paging = "3.5.1"

# --- Media3 ---
media3 = "1.11.0"

# --- Networking ---
okhttp = "5.5.0"

# --- Image loading ---
coil = "3.5.0"

# --- Coroutines ---
coroutines = "1.11.0"

# --- Serialization ---
serializationJson = "1.11.0"

# --- Android TV ---
tvMaterial = "1.1.0"

# --- Playback ---
libmpv = "1.0.0"
assMedia = "0.5.1"
androidyoutubeplayer = "13.0.0"

# --- Plugin runtime (sideload flavor) ---
quickjsKt = "1.0.14"
jsoup = "1.18.3"

# --- Misc ---
materialKolor = "5.0.0"
metricsPerformance = "1.0.0"
desugar = "2.1.5"
zxing = "3.5.3"
json = "20240303"

# --- Test ---
junitJupiter = "6.1.3"
junit4 = "4.13.2"
androidxTestCore = "1.6.1"
androidxTestRules = "1.6.1"
androidxTestExtJunit = "1.2.1"
espresso = "3.6.1"
robolectric = "4.15.1"
roborazzi = "1.43.1"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "coreSplashscreen" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }

androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "material3" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui", version.ref = "composeAndroidx" }
androidx-compose-runtime = { group = "androidx.compose.runtime", name = "runtime", version.ref = "composeAndroidx" }
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation", version.ref = "composeAndroidx" }
androidx-compose-animation = { group = "androidx.compose.animation", name = "animation" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-test = { group = "androidx.compose.ui", name = "ui-test" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
google-material = { group = "com.google.android.material", name = "material", version.ref = "material" }

androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-ktx = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx", version.ref = "lifecycle" }

androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }

androidx-paging-runtime = { group = "androidx.paging", name = "paging-runtime", version.ref = "paging" }
androidx-paging-compose = { group = "androidx.paging", name = "paging-compose", version.ref = "paging" }

androidx-media3-common = { group = "androidx.media3", name = "media3-common", version.ref = "media3" }
androidx-media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
androidx-media3-exoplayer-hls = { group = "androidx.media3", name = "media3-exoplayer-hls", version.ref = "media3" }
androidx-media3-exoplayer-dash = { group = "androidx.media3", name = "media3-exoplayer-dash", version.ref = "media3" }
androidx-media3-ui = { group = "androidx.media3", name = "media3-ui", version.ref = "media3" }
androidx-media3-session = { group = "androidx.media3", name = "media3-session", version.ref = "media3" }
androidx-media3-datasource = { group = "androidx.media3", name = "media3-datasource", version.ref = "media3" }
androidx-media3-datasource-okhttp = { group = "androidx.media3", name = "media3-datasource-okhttp", version.ref = "media3" }
androidx-media3-extractor = { group = "androidx.media3", name = "media3-extractor", version.ref = "media3" }
androidx-media3-effect = { group = "androidx.media3", name = "media3-effect", version.ref = "media3" }

okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-logging-interceptor = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp" }

coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
coil-core = { group = "io.coil-kt.coil3", name = "coil-core", version.ref = "coil" }
# `SingletonImageLoader` lives in the `coil` artifact, not `coil-core`.
# CrispyApplication installs the process-wide ImageLoader through it.
coil-singleton = { group = "io.coil-kt.coil3", name = "coil", version.ref = "coil" }
coil-network-okhttp = { group = "io.coil-kt.coil3", name = "coil-network-okhttp", version.ref = "coil" }
coil-svg = { group = "io.coil-kt.coil3", name = "coil-svg", version.ref = "coil" }

coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
coroutines-swing = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-swing", version.ref = "coroutines" }

serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serializationJson" }

androidx-tv-material = { group = "androidx.tv", name = "tv-material", version.ref = "tvMaterial" }

libmpv = { group = "dev.jdtech.mpv", name = "libmpv", version.ref = "libmpv" }
ass-media = { group = "io.github.peerless2012", name = "ass-media", version.ref = "assMedia" }
androidyoutubeplayer = { group = "com.pierfrancescosoffritti.androidyoutubeplayer", name = "core", version.ref = "androidyoutubeplayer" }

quickjs-kt = { group = "io.github.dokar3", name = "quickjs-kt", version.ref = "quickjsKt" }
quickjs-kt-jvm = { group = "io.github.dokar3", name = "quickjs-kt-jvm", version.ref = "quickjsKt" }
jsoup = { group = "org.jsoup", name = "jsoup", version.ref = "jsoup" }

material-kolor = { group = "com.materialkolor", name = "material-kolor", version.ref = "materialKolor" }
metrics-performance = { group = "androidx.metrics", name = "metrics-performance", version.ref = "metricsPerformance" }
desugar-jdk-libs-nio = { group = "com.android.tools", name = "desugar_jdk_libs_nio", version.ref = "desugar" }
zxing-core = { group = "com.google.zxing", name = "core", version.ref = "zxing" }
org-json = { group = "org.json", name = "json", version.ref = "json" }

junit-jupiter = { group = "org.junit.jupiter", name = "junit-jupiter", version.ref = "junitJupiter" }
junit4 = { group = "junit", name = "junit", version.ref = "junit4" }
androidx-test-core-ktx = { group = "androidx.test", name = "core-ktx", version.ref = "androidxTestCore" }
androidx-test-rules = { group = "androidx.test", name = "rules", version.ref = "androidxTestRules" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestExtJunit" }
espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }

# Golden-screenshot testing on a plain JVM: Robolectric supplies the Android
# runtime (including real Skia via GraphicsMode.NATIVE) and Roborazzi captures
# the result as a PNG, so no emulator and no KVM are required.
#
# The Roborazzi Gradle plugin is deliberately NOT applied: 1.43.1 fails against
# AGP 9.3 with "Extension of type 'TestedExtension' does not exist". The library
# works without it, so record/verify is driven by -Proborazzi.* properties below.
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
roborazzi = { group = "io.github.takahirom.roborazzi", name = "roborazzi", version.ref = "roborazzi" }
roborazzi-compose = { group = "io.github.takahirom.roborazzi", name = "roborazzi-compose", version.ref = "roborazzi" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
android-kotlin-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
