[versions]
# --- Build tooling ---
agp = "9.3.0"
kotlin = "2.4.10"

# --- AndroidX core ---
coreKtx = "1.19.0"
coreSplashscreen = "1.0.1"
appcompat = "1.8.0"
activityCompose = "1.13.0"

# --- Compose ---
composeBom = "2026.08.00"
material = "1.12.0"

# Material3 Expressive, on every target, via one coordinate.
#
# ## Why not `compose.material3`, and why not `androidx.compose.material3`
#
# The `compose.material3` Gradle-accessor alias deliberately tracks the latest
# *stable* Material3, which is 1.4.0 -- and 1.4.0 has no Expressive. CMP decoupled
# Material3 versioning from the plugin in 1.9.0 precisely so a project can opt
# forward; the documented way is to replace the alias with an explicit coordinate.
# See the CMP 1.9.3 whats-new, "Material 3 Expressive theme".
#
# `org.jetbrains.compose.material3:material3` is the coordinate that works
# everywhere, because it is a thin alias that delegates per target:
#
#   android -> androidx.compose.material3:material3-android:1.5.0-alpha27  (real AndroidX)
#   desktop -> org.jetbrains.compose.material3:material3-desktop:1.13.0-alpha01 (real fork)
#   ios*    -> org.jetbrains.compose.material3:material3-iosarm64:1.13.0-alpha01
#
# So there is never more than one material3 on the classpath, the
# `androidx.compose.material3` package and imports are identical on every target,
# and desktop/iOS get the Expressive widgets (`LoadingIndicator`, `MaterialShapes`,
# `WavyProgressIndicator`) that Android already had. Verified by resolving the
# dependency graph, not inferred.
#
# ## Why 1.13.0-alpha01 and not the nearer 1.12.0-alpha03
#
# Because the choice is between moving forward and moving *backward*:
#
# | version  | AndroidX material3 | AndroidX Compose | direction        |
# |----------|--------------------|------------------|------------------|
# | 1.9.0    | 1.4.0 (stable)     | 1.7.x            | no Expressive    |
# | 1.12.0-3 | 1.5.0-alpha22      | 1.12.0-beta01     | BACKWARD         |
# | 1.13.0-1 | 1.5.0-alpha27      | 1.13.0-alpha02    | forward          |
#
# `1.12.0-beta01` is *older* than the `1.12.0` stable this repo was on -- publication
# order is alpha01..alpha03, beta01, beta02, rc01, 1.12.0 -- so that option
# downgrades both material3 and the whole Compose stack. The app's goldens were
# recorded against `1.5.0-alpha26`, and 1.13.0-alpha01 is the only published
# JetBrains material3 at or ahead of it.
#
# The cost is that the Compose stack leaves stable for `1.13.0-alpha02`. That is
# accepted deliberately, and the golden screenshots are the check on it.
composeMaterial3 = "1.13.0-alpha01"

# The androidx.compose.* version. Set to what `composeMaterial3` requires on
# Android (1.13.0-alpha02) rather than left lower, so the resolved graph has one
# Compose version instead of a resolved-up surprise. A KMP source set's dependency
# handler has no `platform()`, so the BOM cannot be applied in a KMP module; the
# plain Android modules still apply `androidx-compose-bom` for everything else.
# AGENTS.md: bump this with `composeMaterial3`, never alone.
composeAndroidx = "1.13.0-alpha02"

# Compose Multiplatform. Pinned to the generation that ships with the Kotlin
# version above: Kotlin 2.4.x pairs with CMP 1.11.x. Do not bump this independently
# of `kotlin` -- a mismatch surfaces as an opaque compose-compiler error.
composeMultiplatform = "1.11.1"

# --- Lifecycle ---
# native-engine was on 2.10.0; unified to 2.11.0 (what :app already used).
lifecycle = "2.11.0"

# --- Navigation ---
navigationCompose = "2.9.8"

# --- Paging ---
paging = "3.5.1"

# --- Media3 ---
media3 = "1.11.0"

# --- Networking ---
okhttp = "5.5.0"

# --- Image loading ---
coil = "3.5.0"

# --- Coroutines ---
coroutines = "1.11.0"

# --- Serialization ---
serializationJson = "1.11.0"

# --- Android TV ---
tvMaterial = "1.1.0"

# --- Playback ---
libmpv = "1.0.0"
assMedia = "0.5.1"
androidyoutubeplayer = "13.0.0"

# --- Plugin runtime (sideload flavor) ---
quickjsKt = "1.0.14"
jsoup = "1.18.3"

# --- Misc ---
materialKolor = "5.0.0"
metricsPerformance = "1.0.0"
desugar = "2.1.5"
zxing = "3.5.3"
json = "20240303"

# --- Test ---
junitJupiter = "6.1.3"
junit4 = "4.13.2"
androidxTestCore = "1.6.1"
androidxTestRules = "1.6.1"
androidxTestExtJunit = "1.2.1"
espresso = "3.6.1"
robolectric = "4.15.1"
roborazzi = "1.43.1"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "coreSplashscreen" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }

androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
# The one material3 every module uses, on every target. See the comment on
# `composeMaterial3` for why this is the JetBrains coordinate and not the
# androidx one, and why it is not `compose.material3`.
compose-material3 = { group = "org.jetbrains.compose.material3", name = "material3", version.ref = "composeMaterial3" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui", version.ref = "composeAndroidx" }
