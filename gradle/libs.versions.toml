[versions]
# --- Build tooling ---
agp = "9.3.0"
kotlin = "2.4.10"

# --- AndroidX core ---
coreKtx = "1.19.0"
coreSplashscreen = "1.0.1"
appcompat = "1.8.0"
activityCompose = "1.13.0"

# --- Compose ---
composeBom = "2026.08.00"
material3 = "1.5.0-alpha26"
material = "1.12.0"

# --- Lifecycle ---
# native-engine was on 2.10.0; unified to 2.11.0 (what :app already used).
lifecycle = "2.11.0"

# --- Navigation ---
navigationCompose = "2.9.8"

# --- Paging ---
paging = "3.5.1"

# --- Media3 ---
media3 = "1.11.0"

# --- Networking ---
okhttp = "5.5.0"

# --- Image loading ---
coil = "3.5.0"

# --- Coroutines ---
coroutines = "1.11.0"

# --- Serialization ---
serializationJson = "1.11.0"

# --- Android TV ---
tvMaterial = "1.1.0"

# --- Playback ---
libmpv = "1.0.0"
assMedia = "0.5.1"
androidyoutubeplayer = "13.0.0"

# --- Plugin runtime (foss flavor) ---
quickjsKt = "1.0.14"
jsoup = "1.18.3"

# --- Misc ---
materialKolor = "5.0.0"
metricsPerformance = "1.0.0"
desugar = "2.1.5"
zxing = "3.5.3"
json = "20240303"

# --- Test ---
junitJupiter = "6.1.3"
androidxTestCore = "1.6.1"
