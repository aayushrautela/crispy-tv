name: Android

# Verification for the phone/tablet app and the TV app. Manual only, by
# deliberate choice: nothing here runs unless someone clicks Run.
#
# This replaces three overlapping workflows (a push-triggered fast loop, an
# Android-only gate, and a separate TV gate). They are named by platform and
# intent rather than by Gradle build type, because "debug CI" and "debug build"
# are different things and having both in the name was confusing.
#
# For signed distributables use android-release.yml. For Apple use apple.yml.

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ORG_GRADLE_PROJECT_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      ORG_GRADLE_PROJECT_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      ORG_GRADLE_PROJECT_CRISPY_BACKEND_URL: ${{ secrets.CRISPY_BACKEND_URL }}
      ORG_GRADLE_PROJECT_DEBUG_KEYSTORE_PATH: ${{ github.workspace }}/.keystores/crispy-debug-key.jks
      ORG_GRADLE_PROJECT_DEBUG_KEYSTORE_PASSWORD: ${{ secrets.DEBUG_KEYSTORE_PASSWORD }}
      ORG_GRADLE_PROJECT_DEBUG_KEY_ALIAS: ${{ secrets.DEBUG_KEY_ALIAS }}
      ORG_GRADLE_PROJECT_DEBUG_KEY_PASSWORD: ${{ secrets.DEBUG_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          # The `android` CLI accepts SDK licences itself; sdkmanager is deprecated.
          android sdk install "platforms;android-37.0" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # ---- cheap gates, fail fast -------------------------------------------

      - name: Validate workflow YAML
        run: python3 scripts/validate_workflows.py

      - name: Check commonMain purity
        run: python scripts/check_common_purity.py

      - name: Check the KMP module graph
        # A commonMain source set may only depend on another commonMain. A plain
        # com.android.library publishes no JVM variant, so a commonMain edge into
        # one is invisible to the compiler in a way the purity gate cannot see:
        # the Kotlin is clean and the reference still cannot resolve off Android.
        run: python3 scripts/verify_kmp_structure.py

      - name: Validate contract fixtures
        run: python scripts/validate_contracts.py

      - name: Verify store build excludes sideload-only engines
        # Reads the resolved dependency graph, so it is valid for every variant.
        run: ./gradlew :android:androidApp:verifyDistributionExclusions

      - name: Run contract tests
        # The contract suite lives in :core-domain's commonTest, so the host-test
        # task runs all of it on a JVM. The Apple simulator run in apple.yml is
        # the other half: it is what notices the suite holding a JVM API.
        run: ./gradlew :android:core-domain:testAndroidHostTest

      - name: Run app composition-root tests
        # The androidMain half of :app. The tests need a Context and nothing
        # else -- no view, no resource -- so they run without the merged manifest
        # a rendering test would require, which is why they can live in :app at
        # all. Robolectric is here for the Context, not for rendering.
        run: ./gradlew :android:app:testAndroidHostTest

      - name: Check :app's commonMain against metadata dependencies
        # The local non-Android signal for :app, which has no JVM test target:
        # this compiles commonMain against the metadata variant of every
        # dependency, so it is the one task that catches a JVM-only symbol the
        # Android compile would accept.
        run: ./gradlew :android:app:compileCommonMainKotlinMetadata

      - name: Run backend common tests
        # :backend declares withHostTest{} so its commonTest runs on the platform
        # the module actually ships to -- without it AGP warns and runs neither.
        # The Apple simulator run in apple.yml is what notices a file that moved
        # into commonMain reaching for a JVM API.
        run: ./gradlew :android:backend:testAndroidHostTest

      - name: Run home common tests
        # :home's commonTest is where the moved home services are pinned, and
        # the host test runs it on the platform the module ships to.
        run: ./gradlew :android:home:testAndroidHostTest

      - name: Run the feature modules' host tests
        # Every module declares withHostTest{}, and six of them had a suite no
        # gate compiled: :addons' ten commonTest files plus its androidHostTest,
        # and one to three files each in :watchhistory, :player, :network,
        # :platform-core and :sharedUI. That hole is how a test file that had
        # never type-checked survived in :addons. They are cheap, and each one is
        # the only place its module's commonTest is compiled.
        run: ./gradlew :android:addons:testAndroidHostTest :android:watchhistory:testAndroidHostTest :android:player:testAndroidHostTest :android:network:testAndroidHostTest :android:platform-core:testAndroidHostTest :android:sharedUI:testAndroidHostTest

      - name: Run plugins module unit tests
        run: ./gradlew :android:plugins:testDebugUnitTest

      - name: Upload plugins test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: plugins-test-reports
          path: android/plugins/build/reports/tests/
          if-no-files-found: warn

      - name: Run app unit tests
        run: ./gradlew :android:androidApp:testStoreDebugUnitTest

      - name: Run Android TV unit tests
        # The TV module had a test suite that nothing ran, so a broken test was
        # indistinguishable from a passing one. `:tv` is a plain
        # com.android.application, so `test` is the task that covers both of its
        # build types' unit tests.
        run: ./gradlew :android:tv:test

      # ---- build ------------------------------------------------------------

      - name: Download TorrServer binaries
        run: |
          chmod +x .github/scripts/fetch-torrserver-binaries.sh
          .github/scripts/fetch-torrserver-binaries.sh

      - name: Decode Android debug keystore
        # Must run before any assemble: the four DEBUG_KEYSTORE_* variables above
        # are what switch :android:androidApp to its custom debug signingConfig, and
        # config points at this file. Setting the variables without creating the
        # keystore is what previously broke validateSigningStoreDebug.
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.keystores"
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/.keystores/crispy-debug-key.jks"
          fi

      - name: Lint Android app
        run: ./gradlew :android:androidApp:lintStoreDebug :android:androidApp:lintSideloadDebug

      - name: Upload app lint reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: lint-reports-app
          path: |
            android/androidApp/build/reports/lint-results-*Debug.txt
            android/androidApp/build/reports/lint-results-*Debug.html
            android/androidApp/build/intermediates/lint_intermediate_text_report/*/lintReport*/lint-results-*.txt
          if-no-files-found: warn

      - name: Lint Android TV
        run: ./gradlew :android:tv:lintDebug

      - name: Upload TV lint reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: lint-reports-tv
          path: |
            android/tv/build/reports/lint-results-debug.txt
            android/tv/build/reports/lint-results-debug.html
            android/tv/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
          if-no-files-found: warn

      - name: Assemble Android app
        run: ./gradlew :android:androidApp:assembleStoreDebug :android:androidApp:assembleSideloadDebug

      - name: Assemble Android TV
        run: ./gradlew :android:tv:assembleDebug

      # ---- assertions on the built artefacts --------------------------------

      - name: Assert store APKs exclude sideload-only engines
        # Reads the dex, so it only means something on an unminified build --
        # which is what debug is. The sideload APKs are the control that proves
        # the markers still match; on a minified build that control fires and
        # names the cause rather than letting a false pass through. Release
        # builds use the graph check above instead.
        run: |
          python scripts/verify_apk_distribution.py \
            --store android/androidApp/build/outputs/apk/store/debug/*.apk \
            --sideload android/androidApp/build/outputs/apk/sideload/debug/*.apk

      - name: Assert no compiled class outlives its declaration
        # A stale class in build/classes/kotlin binds a reference that should fail
        # to compile, so it can make every other assertion in this workflow report
        # a false pass. A fresh runner never sees one, which is the point: this is
        # a guard for the day output caching or a warm build directory arrives, and
        # it keeps the script itself honest in an environment built from scratch.
        run: python scripts/verify_kmp_outputs.py

      # ---- artefacts --------------------------------------------------------

      - name: Upload store app APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug-store
          path: android/androidApp/build/outputs/apk/store/debug/*.apk
          if-no-files-found: error

      - name: Upload sideload app APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug-sideload
          path: android/androidApp/build/outputs/apk/sideload/debug/*.apk
          if-no-files-found: error

      - name: Upload TV APKs
        uses: actions/upload-artifact@v7
        with:
          name: tv-debug
          path: android/tv/build/outputs/apk/debug/*.apk
          if-no-files-found: error
