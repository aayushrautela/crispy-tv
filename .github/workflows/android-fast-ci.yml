name: Android Fast CI

# Fast inner loop: runs on every push. Deliberately small — contracts,
# contract tests, and one flavor assemble. The full matrix (both flavors,
# lint, all APKs, Apple targets) lives in android-debug-ci.yml and runs on
# pull_request and manual dispatch.

on:
  push:

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ORG_GRADLE_PROJECT_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      ORG_GRADLE_PROJECT_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      ORG_GRADLE_PROJECT_CRISPY_BACKEND_URL: ${{ secrets.CRISPY_BACKEND_URL }}
      # Deliberately no DEBUG_KEYSTORE_* here. The fast push loop exists to catch
      # regressions, not to produce a distributable artefact, so it uses the
      # stock Android debug keystore. This workflow set all four values without
      # ever creating the .jks, which activated the custom debug signingConfig
      # and failed :android:app:validateSigningStoreDebug on every push.
      # android-debug-ci.yml does decode a real keystore and keeps them.

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          # The `android` CLI accepts SDK licences itself; sdkmanager is deprecated.
          android sdk install "platforms;android-37.0" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install contract validation dependency
        run: pip install jsonschema==4.23.0

      - name: Validate contract fixtures
        run: python scripts/validate_contracts.py

      - name: Check commonMain purity
        run: python scripts/check_common_purity.py

      - name: Run JVM contract tests
        run: ./gradlew :android:contract-tests:test

      - name: Verify store build excludes sideload-only engines
        run: ./gradlew :android:app:verifyDistributionExclusions

      - name: Verify golden screenshots
        # Verify mode is the default; a rendering regression fails here rather
        # than reaching a user.
        run: ./gradlew :android:app:testStoreDebugUnitTest

      - name: Upload screenshot diffs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: screenshot-diffs
          path: android/app/build/outputs/roborazzi/
          if-no-files-found: warn

      - name: Assemble store flavor
        run: ./gradlew :android:app:assembleStoreDebug

      - name: Assemble sideload flavor
        run: ./gradlew :android:app:assembleSideloadDebug

      - name: Assert store APKs exclude sideload-only engines
        # Graph-level check is above; this reads the built dex. The sideload APKs
        # are the control that proves the markers still match.
        run: |
          python scripts/verify_apk_distribution.py \
            --store android/app/build/outputs/apk/store/debug/*.apk \
            --sideload android/app/build/outputs/apk/sideload/debug/*.apk

      - name: Upload store-flavor APK
        uses: actions/upload-artifact@v7
        with:
          name: crispy-rewrite-app-debug-store
          path: android/app/build/outputs/apk/store/debug/*.apk
          if-no-files-found: warn
