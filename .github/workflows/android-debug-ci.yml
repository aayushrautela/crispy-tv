name: Android Debug CI

# Full gate: runs on pull_request and manual dispatch. The fast push-triggered
# loop lives in android-fast-ci.yml.

on:
  pull_request:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ORG_GRADLE_PROJECT_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      ORG_GRADLE_PROJECT_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      ORG_GRADLE_PROJECT_CRISPY_BACKEND_URL: ${{ secrets.CRISPY_BACKEND_URL }}
      ORG_GRADLE_PROJECT_DEBUG_KEYSTORE_PATH: ${{ github.workspace }}/.keystores/crispy-debug-key.jks
      ORG_GRADLE_PROJECT_DEBUG_KEYSTORE_PASSWORD: ${{ secrets.DEBUG_KEYSTORE_PASSWORD }}
      ORG_GRADLE_PROJECT_DEBUG_KEY_ALIAS: ${{ secrets.DEBUG_KEY_ALIAS }}
      ORG_GRADLE_PROJECT_DEBUG_KEY_PASSWORD: ${{ secrets.DEBUG_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          # The `android` CLI accepts SDK licences itself; sdkmanager is deprecated.
          android sdk install "platforms;android-37.0" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install contract validation dependency
        run: pip install jsonschema==4.23.0

      - name: Validate contract fixtures
        run: python scripts/validate_contracts.py

      - name: Check commonMain purity
        run: python scripts/check_common_purity.py

      - name: Verify store build excludes sideload-only engines
        run: ./gradlew :android:app:verifyDistributionExclusions

      - name: Verify golden screenshots
        run: ./gradlew :android:app:testPlayDebugUnitTest

      - name: Upload screenshot diffs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: screenshot-diffs-pr
          path: android/app/build/outputs/roborazzi/
          if-no-files-found: warn

      - name: Download TorrServer binaries
        run: |
          chmod +x .github/scripts/fetch-torrserver-binaries.sh
          .github/scripts/fetch-torrserver-binaries.sh

      - name: Decode Android debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.keystores"
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/.keystores/crispy-debug-key.jks"
          fi

      - name: Run JVM contract tests
        run: ./gradlew :android:contract-tests:test

      - name: Run plugins module unit tests
        run: ./gradlew :android:plugins:testSideloadDebugUnitTest

      - name: Upload plugins test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: plugins-test-reports
          path: android/plugins/build/reports/tests/
          if-no-files-found: warn

      - name: Lint Android app
        run: ./gradlew :android:app:lintStoreDebug :android:app:lintSideloadDebug

      - name: Upload lint reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: lint-reports-app-debug
          path: |
            android/app/build/reports/lint-results-*Debug.txt
            android/app/build/reports/lint-results-*Debug.html
            android/app/build/intermediates/lint_intermediate_text_report/*/lintReport*/lint-results-*.txt
          if-no-files-found: warn

      - name: Assemble Android app
        run: ./gradlew :android:app:assembleStoreDebug :android:app:assembleSideloadDebug :android:app:assembleStoreDebugAndroidTest :android:app:assembleSideloadDebugAndroidTest

      - name: Assert store APKs exclude sideload-only engines
        # Graph-level check is above; this reads the built dex of every ABI
        # split. The sideload APKs are the control that proves the markers match.
        run: |
          python scripts/verify_apk_distribution.py \
            --store android/app/build/outputs/apk/store/debug/*.apk \
            --sideload android/app/build/outputs/apk/sideload/debug/*.apk

      - name: Upload store-flavor APK
        uses: actions/upload-artifact@v7
        with:
          name: crispy-rewrite-app-debug-store-universal
          path: android/app/build/outputs/apk/store/debug/*-universal-*.apk
          if-no-files-found: warn

      - name: Upload sideload-flavor APK
        uses: actions/upload-artifact@v7
        with:
          name: crispy-rewrite-app-debug-sideload-universal
          path: android/app/build/outputs/apk/sideload/debug/*-universal-*.apk
          if-no-files-found: warn

      - name: Upload sideload arm64-v8a APK
        uses: actions/upload-artifact@v7
        with:
          name: crispy-rewrite-app-debug-sideload-arm64-v8a
          path: android/app/build/outputs/apk/sideload/debug/*-arm64-v8a-*.apk
          if-no-files-found: warn

      - name: Upload sideload armeabi-v7a APK
        uses: actions/upload-artifact@v7
        with:
          name: crispy-rewrite-app-debug-sideload-armeabi-v7a
          path: android/app/build/outputs/apk/sideload/debug/*-armeabi-v7a-*.apk
          if-no-files-found: warn

      - name: Upload sideload x86_64 APK
        uses: actions/upload-artifact@v7
        with:
          name: crispy-rewrite-app-debug-sideload-x86_64
          path: android/app/build/outputs/apk/sideload/debug/*-x86_64-*.apk
          if-no-files-found: warn
