name: iOS unsigned IPA

# Builds the iOS app for arm64 devices WITHOUT code signing. The output is an
# unsigned .ipa that must be re-signed on install (Sideloadly / AltStore with a
# free Apple ID, or TrollStore). No Apple developer account required.
on:
  workflow_dispatch:

jobs:
  ipa:
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select newest Xcode
        run: |
          ls -d /Applications/Xcode*.app | sort -V
          LATEST_XCODE="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          sudo xcode-select -s "$LATEST_XCODE"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Apple project
        run: |
          rm -rf ios/CrispyRewriteApple.xcodeproj
          cd ios
          xcodegen generate --spec project.yml

      - name: Archive (unsigned, generic iOS device)
        run: >-
          xcodebuild archive
          -project ios/CrispyRewriteApple.xcodeproj
          -scheme CrispyRewriteiOS
          -configuration Release
          -destination 'generic/platform=iOS'
          -archivePath build/CrispyRewriteiOS.xcarchive
          ONLY_ACTIVE_ARCH=NO
          CODE_SIGN_IDENTITY=""
          DEVELOPMENT_TEAM=""
          CODE_SIGNING_REQUIRED=NO
          CODE_SIGNING_ALLOWED=NO

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="$(find build/CrispyRewriteiOS.xcarchive/Products/Applications -maxdepth 1 -name '*.app' | head -n 1)"
          if [ -z "$APP_PATH" ]; then
            echo "No .app found in archive" >&2
            exit 1
          fi
          echo "Found app: $APP_PATH"
          rm -rf build/Payload
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          cd build
          rm -f crispy-ios-unsigned.ipa
          zip -qry crispy-ios-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: crispy-ios-unsigned-ipa
          path: build/crispy-ios-unsigned.ipa
          if-no-files-found: error
