name: Android Release

# Signed distributables for the phone/tablet app and the TV app. Manual only.
#
# Kept separate from android.yml because this is the only workflow that needs
# the release signing secrets, and those should not sit in a workflow someone
# runs casually after every change.
#
# Produces:
#   - a store AAB for Google Play (app only; the TV app is not distributed there)
#   - per-ABI sideload APKs for the app, with a -sideload version suffix
#   - per-ABI release APKs for the TV app
#
# Note the asymmetry in how the distribution is asserted: the app's dex is
# minified, so the store check here reads the resolved dependency graph rather
# than scanning the dex. See verify_apk_distribution.py's docstring.

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ORG_GRADLE_PROJECT_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      ORG_GRADLE_PROJECT_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      ORG_GRADLE_PROJECT_CRISPY_BACKEND_URL: ${{ secrets.CRISPY_BACKEND_URL }}
      ORG_GRADLE_PROJECT_RELEASE_KEYSTORE_PATH: ${{ github.workspace }}/.keystores/crispy-release-key.jks
      ORG_GRADLE_PROJECT_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
      ORG_GRADLE_PROJECT_RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      ORG_GRADLE_PROJECT_RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
      ORG_GRADLE_PROJECT_DEBUG_KEYSTORE_PATH: ${{ github.workspace }}/.keystores/crispy-debug-key.jks
      ORG_GRADLE_PROJECT_DEBUG_KEYSTORE_PASSWORD: ${{ secrets.DEBUG_KEYSTORE_PASSWORD }}
      ORG_GRADLE_PROJECT_DEBUG_KEY_ALIAS: ${{ secrets.DEBUG_KEY_ALIAS }}
      ORG_GRADLE_PROJECT_DEBUG_KEY_PASSWORD: ${{ secrets.DEBUG_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          # The `android` CLI accepts SDK licences itself; sdkmanager is deprecated.
          android sdk install "platforms;android-37.0" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install contract validation dependency
        run: pip install jsonschema==4.23.0

      - name: Validate contract fixtures
        run: python scripts/validate_contracts.py

      - name: Download TorrServer binaries
        run: |
          chmod +x .github/scripts/fetch-torrserver-binaries.sh
          .github/scripts/fetch-torrserver-binaries.sh

      - name: Decode Android signing keystores
        # Must run before any assemble: the RELEASE_KEYSTORE_* variables above are
        # what create the release signingConfig, and it points at this file.
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.keystores"
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/.keystores/crispy-release-key.jks"
          fi
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/.keystores/crispy-debug-key.jks"
          fi

      - name: Run JVM contract tests
        run: ./gradlew :android:contract-tests:test

      - name: Run plugins module unit tests
        run: ./gradlew :android:plugins:testSideloadDebugUnitTest

      - name: Upload plugins test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: plugins-test-reports
          path: android/plugins/build/reports/tests/
          if-no-files-found: warn

      # ---- phone / tablet app -----------------------------------------------

      - name: Build store bundle
        run: ./gradlew :android:app:bundleStoreRelease

      - name: Build sideload APKs
        run: ./gradlew -PbuildSideloadApks :android:app:assembleSideloadRelease

      - name: Assert store build excludes sideload-only engines
        # The dependency graph, not the dex. Release is minified, so scanning the
        # dex for package names proves nothing: absence would be guaranteed
        # whether or not the code shipped. The graph is minification-proof.
        run: ./gradlew :android:app:verifyDistributionExclusions

      - name: Upload store AAB
        uses: actions/upload-artifact@v7
        with:
          name: app-release-store-aab
          path: android/app/build/outputs/bundle/storeRelease/*.aab
          if-no-files-found: error

      - name: Upload sideload APKs
        uses: actions/upload-artifact@v7
        with:
          name: app-release-sideload
          path: android/app/build/outputs/apk/sideload/release/*.apk
          if-no-files-found: error

      # ---- TV ---------------------------------------------------------------

      - name: Assemble Android TV
        run: ./gradlew :android:tv:assembleRelease

      - name: Upload TV release APKs
        uses: actions/upload-artifact@v7
        with:
          name: tv-release
          path: android/tv/build/outputs/apk/release/*.apk
          if-no-files-found: error
