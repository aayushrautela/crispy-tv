name: Android TV Debug CI

on:
  workflow_dispatch:

jobs:
  android-tv:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ORG_GRADLE_PROJECT_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      ORG_GRADLE_PROJECT_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      ORG_GRADLE_PROJECT_CRISPY_BACKEND_URL: ${{ secrets.CRISPY_BACKEND_URL }}
      ORG_GRADLE_PROJECT_DEBUG_KEYSTORE_PATH: ${{ github.workspace }}/.keystores/crispy-debug-key.jks
      ORG_GRADLE_PROJECT_DEBUG_KEYSTORE_PASSWORD: ${{ secrets.DEBUG_KEYSTORE_PASSWORD }}
      ORG_GRADLE_PROJECT_DEBUG_KEY_ALIAS: ${{ secrets.DEBUG_KEY_ALIAS }}
      ORG_GRADLE_PROJECT_DEBUG_KEY_PASSWORD: ${{ secrets.DEBUG_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platforms;android-37.0" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.7.1"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install contract validation dependency
        run: pip install jsonschema==4.23.0

      - name: Validate contract fixtures
        run: python scripts/validate_contracts.py

      - name: Download TorrServer binaries
        run: |
          chmod +x .github/scripts/fetch-torrserver-binaries.sh
          .github/scripts/fetch-torrserver-binaries.sh

      - name: Decode Android debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.keystores"
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/.keystores/crispy-debug-key.jks"
          fi

      - name: Run JVM contract tests
        run: gradle :android:contract-tests:test

      - name: Lint Android TV
        run: gradle :android:tv:lintDebug

      - name: Upload lint reports
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: lint-reports-tv-debug
          path: |
            android/tv/build/reports/lint-results-debug.txt
            android/tv/build/reports/lint-results-debug.html
            android/tv/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
          if-no-files-found: warn

      - name: Assemble Android TV
        run: gradle :android:tv:assembleDebug

      - name: Upload TV universal APK
        uses: actions/upload-artifact@v6
        with:
          name: crispy-rewrite-tv-debug-universal
          path: android/tv/build/outputs/apk/debug/*-universal-*.apk
          if-no-files-found: error

      - name: Upload TV arm64-v8a APK
        uses: actions/upload-artifact@v6
        with:
          name: crispy-rewrite-tv-debug-arm64-v8a
          path: android/tv/build/outputs/apk/debug/*-arm64-v8a-*.apk
          if-no-files-found: warn

      - name: Upload TV armeabi-v7a APK
        uses: actions/upload-artifact@v6
        with:
          name: crispy-rewrite-tv-debug-armeabi-v7a
          path: android/tv/build/outputs/apk/debug/*-armeabi-v7a-*.apk
          if-no-files-found: warn

      - name: Upload TV x86_64 APK
        uses: actions/upload-artifact@v6
        with:
          name: crispy-rewrite-tv-debug-x86_64
          path: android/tv/build/outputs/apk/debug/*-x86_64-*.apk
          if-no-files-found: warn
