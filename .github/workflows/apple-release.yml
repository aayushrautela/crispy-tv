name: Apple Release

# Builds the iOS app as an unsigned .ipa for sideloading. Manual only.
#
# Kept separate from apple.yml because it archives and packages a distributable
# rather than verifying anything, and because it is the only workflow here that
# produces something a user installs.
#
# The result is UNSIGNED and must be re-signed on install (Sideloadly /
# AltStore with a free Apple ID, or TrollStore). No Apple developer account is
# needed. If you want a properly signed build, that needs a different setup and
# is not what this workflow does.

on:
  workflow_dispatch:

jobs:
  ipa:
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Python dependencies
        # After Checkout, because it installs from requirements.txt in the working
        # tree. --user because this workflow uses the runner's system python3,
        # not a setup-python toolchain, and that python may be externally managed
        # (PEP 668) and refuse a bare install.
        run: python3 -m pip install --user -r requirements.txt

      - name: Validate workflow YAML
        # A duplicate key makes a workflow fail to *load*, which produces a run
        # that fails in under a second with an empty log. That reads as "the tests
        # failed" when no test ever ran, and nothing inside the workflow can report
        # it. Checked right after the dependencies so a malformed file is named as
        # the problem it is. It cannot come before Checkout: the script would not
        # be on disk yet, which is its own silent failure.
        run: python3 scripts/validate_workflows.py

      - name: Select newest Xcode
        run: |
          ls -d /Applications/Xcode*.app | sort -V
          LATEST_XCODE="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          sudo xcode-select -s "$LATEST_XCODE"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Apple project
        run: |
          rm -rf ios/CrispyRewriteApple.xcodeproj
          cd ios
          xcodegen generate --spec project.yml

      - name: Archive (unsigned, generic iOS device)
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild archive \
            -project ios/CrispyRewriteApple.xcodeproj \
            -scheme CrispyRewriteiOS \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/CrispyRewriteiOS.xcarchive \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build/xcodebuild.log | xcbeautify --renderer github-actions --quiet

      - name: Surface compile errors in job summary
        if: failure()
        run: |
          {
            echo "## Compile errors"
            echo '```'
            grep -E "error: " build/xcodebuild.log | sort -u || echo "(no error lines captured)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload full build log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ipa-xcodebuild-log
          path: build/xcodebuild.log
          if-no-files-found: warn

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="$(find build/CrispyRewriteiOS.xcarchive/Products/Applications -maxdepth 1 -name '*.app' | head -n 1)"
          if [ -z "$APP_PATH" ]; then
            echo "No .app found in archive" >&2
            exit 1
          fi
          echo "Found app: $APP_PATH"
          rm -rf build/Payload
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          cd build
          rm -f crispy-ios-unsigned.ipa
          zip -qry crispy-ios-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v7
        with:
          name: ios-unsigned-ipa
          path: build/crispy-ios-unsigned.ipa
          if-no-files-found: error
