name: Apple

# Verification for everything Apple. Manual only, by deliberate choice.
#
# This is the ONLY place the Apple side can be checked, because Kotlin/Native
# cannot compile iosArm64 or iosSimulatorArm64 on Linux. It covers three
# separate things:
#
#   1. The Kotlin Multiplatform Apple targets. Compiling them from commonMain is
#      what proves no JVM or Android API leaked into shared code -- the check
#      scripts/check_common_purity.py cannot do, because a JVM-only member of the
#      Kotlin stdlib ("x".format(y)) is `kotlin.*` and passes an import scan.
#      :core-domain and :platform-core also declare a compile-only linuxX64
#      target, which catches the same class of bug locally in seconds.
#   2. ios/ContractRunner, the Swift implementation of the domain rules, which
#      the iOS and tvOS apps actually consume via CrispyKit.
#   3. The placeholder iOS / tvOS app compile gate from ios/project.yml.
#
# For the unsigned sideloading IPA use apple-release.yml.

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: macos-26
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select newest Xcode
        run: |
          LATEST_XCODE="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          sudo xcode-select -s "$LATEST_XCODE"
          xcodebuild -version

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        # :core-domain and :platform-core are KMP modules carrying an Android
        # target, so AGP needs an SDK even when only the Apple tasks run.
        # macos-26 happens to ship android-37.0, but relying on the runner image
        # is how the JDK 17 toolchain requirement went unnoticed for months.
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          # The `android` CLI accepts SDK licences itself; sdkmanager is deprecated.
          android sdk install "platforms;android-37.0" "build-tools;36.0.0"

      - name: Set up Gradle
        # Not optional here. Without it every run re-downloads the Kotlin/Native
        # toolchain, which is over a gigabyte and dominates the job's runtime.
        uses: gradle/actions/setup-gradle@v6

      - name: Install Apple tooling
        # xcodegen is not on the runner image. xcbeautify is, but installing it
        # is a no-op when present and turns a future image change from a broken
        # pipe into a no-op instead.
        run: brew install xcodegen xcbeautify

      - name: Check commonMain purity
        run: python3 scripts/check_common_purity.py

      - name: Compile Kotlin Multiplatform Apple targets
        run: |
          ./gradlew \
            :android:core-domain:compileKotlinIosArm64 \
            :android:core-domain:compileKotlinIosSimulatorArm64 \
            :android:core-domain:compileTestKotlinIosSimulatorArm64 \
            :android:platform-core:compileKotlinIosArm64 \
            :android:platform-core:compileKotlinIosSimulatorArm64

      - name: Run Kotlin Multiplatform unit tests on the iOS simulator
        run: |
          ./gradlew \
            :android:core-domain:iosSimulatorArm64Test \
            :android:platform-core:iosSimulatorArm64Test

      - name: Diagnose simulator test failure
        # iosSimulatorArm64Test is the only step that depends on runner hardware
        # state, so surface enough to tell a real regression from an unavailable
        # device. The compile gate above runs first and independently, so a
        # simulator problem can never mask a platform-freedom failure.
        if: failure()
        run: |
          {
            echo "## Available simulators"
            echo '```'
            xcrun simctl list devices available || echo "(simctl unavailable)"
            echo '```'
            echo "## iOS test result files"
            find android -type d -name iosSimulatorArm64Test -path '*test-results*' 2>/dev/null \
              | while read -r dir; do
                  echo "### $dir"
                  for xml in "$dir"/*.xml; do
                    [ -e "$xml" ] || continue
                    if grep -q '<failure' "$xml"; then
                      echo "FAILING: $xml"
                      grep -o 'tests="[0-9]*" skipped="[0-9]*" failures="[0-9]*" errors="[0-9]*"' "$xml" | head -1
                    fi
                  done
                done
          } >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload KMP test results on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: kmp-ios-test-results
          path: |
            android/*/build/test-results/iosSimulatorArm64Test/
          if-no-files-found: warn

      - name: Run Swift contract tests
        run: swift test --package-path ios/ContractRunner

      - name: Generate Apple project
        run: |
          rm -rf ios/CrispyRewriteApple.xcodeproj
          cd ios
          xcodegen generate --spec project.yml

      - name: Build iOS app target
        run: |
          set -o pipefail
          xcodebuild \
            -project ios/CrispyRewriteApple.xcodeproj \
            -scheme CrispyRewriteiOS \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | xcbeautify --renderer github-actions --quiet

      - name: Build tvOS target
        run: |
          set -o pipefail
          xcodebuild \
            -project ios/CrispyRewriteApple.xcodeproj \
            -scheme CrispyRewritetvOS \
            -sdk appletvsimulator \
            -destination 'generic/platform=tvOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | xcbeautify --renderer github-actions --quiet
